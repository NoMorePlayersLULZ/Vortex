<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        
        <nav class="sidebar">
            <div class="sidebar-top">
                <button class="nav-btn active" data-screen="screen-chat" title="Чаты">💬</button>
                <button class="nav-btn" data-screen="screen-search" title="Поиск">🔍</button>
            </div>
            <div class="sidebar-bottom">
                <button class="nav-btn" data-screen="screen-settings" title="Настройки">⚙️</button>
            </div>
        </nav>

        <main class="main-content">
            
            <section id="screen-chat" class="screen active">
                <div class="messenger-layout">
                    <div class="chats-sidebar-panel" id="chats-sidebar">
                        <div class="chats-search-box">
                            <input type="text" placeholder="Поиск чатов..." id="chat-search">
                        </div>
                        <div class="chats-list">
                            <div class="chat-item active" data-chat="vortex-bot">
                                <div class="chat-avatar">🤖</div>
                                <div class="chat-details">
                                    <div class="chat-title-row">
                                        <span class="chat-name">Vortex Bot</span>
                                        <span class="chat-time">14:50</span>
                                    </div>
                                    <div class="chat-preview-row">
                                        <span class="chat-text">Привет! Мобильная вёрстка огонь 🔥</span>
                                        <span class="unread-badge">2</span>
                                    </div>
                                </div>
                            </div>
                            <div class="chat-item" data-chat="dev-group">
                                <div class="chat-avatar">💬</div>
                                <div class="chat-details">
                                    <div class="chat-title-row">
                                        <span class="chat-name">Разработчики</span>
                                        <span class="chat-time">Вчера</span>
                                    </div>
                                    <div class="chat-preview-row">
                                        <span class="chat-text">Запушили изменения в GitHub</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="chat-room-area" id="chat-room">
                        <div class="chat-header-mobile">
                            <button id="back-to-chats-btn" class="back-btn">← Назад</button>
                            <span id="current-chat-title">Vortex Bot</span>
                        </div>
                        <div id="chat-box">
                            <div class="message"><b>Vortex Bot:</b> Добро пожаловать в Vortex! Выбирай чат и общайся.</div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="message-input" placeholder="Написать сообщение...">
                            <button class="action-btn" id="send-btn">Отправить</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="screen-search" class="screen">
                <h2>Глобальный поиск</h2>
                <input type="text" placeholder="Введите запрос для поиска...">
            </section>

            <section id="screen-settings" class="screen">
                <h2>Настройки</h2>
                <div class="settings-group">
                    <label for="theme-select">Тема оформления:</label>
                    <select id="theme-select">
                        <option value="dark-theme">Темная (по умолчанию)</option>
                        <option value="light-theme">Светлая</option>
                    </select>
                </div>
                <div class="version-tag">Vortex Messenger v1.2.1</div>
            </section>

        </main>
    </div>

    <script src="server.js"></script>
</body>
</html>
